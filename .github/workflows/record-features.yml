name: Record Skippy on Mac
on:
  workflow_dispatch:
    inputs:
      settings_from_run:
        type: string
        default: ""
        description: Record visible Settings using a validated universal workspace artifact
      connected_walkthrough:
        type: boolean
        default: false
        description: Record one continuous walkthrough of the connected native Mac workspace
      connected_from_run:
        type: string
        default: ""
        description: Reuse the Skippy-Mac developer ZIP from a completed Skippy checks run
      workspace_only:
        type: boolean
        default: false
        description: Record editable shortcuts, Quick Pins, Parcels actions and annotated multi-capture
      handoffs_only:
        type: boolean
        default: false
        description: Follow web search and a download into their destination apps
      preferences_only:
        type: boolean
        default: false
        description: Recheck Settings and archive the universal build

permissions:
  contents: read
  actions: read

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(inputs.settings_from_run && '["settings-review"]' || inputs.connected_walkthrough && '["connected"]' || inputs.workspace_only && '["workspace"]' || inputs.preferences_only && '["preferences"]' || inputs.handoffs_only && '["searchhandoff","downloadhandoff"]' || '["wheel","files","utilities","system","capture","preferences"]') }}
    name: Film ${{ matrix.batch }}
    env:
      SKIPPY_FILM_BATCH: ${{ matrix.batch }}
      SKIPPY_REUSE_BUILD: ${{ inputs.settings_from_run != '' || inputs.connected_from_run != '' }}
      SKIPPY_UNIVERSAL: ${{ inputs.connected_walkthrough || inputs.workspace_only || inputs.preferences_only || (inputs.handoffs_only && matrix.batch == 'searchhandoff') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the Mac desktop
        run: |
          sw_vers
          xcodebuild -version
          defaults write com.apple.universalaccess reduceMotion -bool false
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
      - uses: actions/download-artifact@v4
        if: ${{ inputs.settings_from_run || inputs.connected_from_run }}
        with:
          name: ${{ inputs.connected_from_run && 'Skippy-Mac' || 'Skippy-tested-universal' }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.connected_from_run || inputs.settings_from_run }}
          path: build
      - name: Unpack the tested build
        if: ${{ inputs.settings_from_run || inputs.connected_from_run }}
        run: |
          ditto -x -k build/Skippy-developer.zip build
          codesign --verify --strict build/Skippy.app
      - name: Record native interactions
        run: bash Scripts/record-feature-library.sh
      - name: Verify the continuous video
        if: ${{ inputs.connected_walkthrough }}
        run: |
          movie=$(find build -path '*/Connected workspace/WindowServer.mp4' -print -quit)
          test -n "$movie"
          ffmpeg -hide_banner -loglevel error -i "$movie" -map 0:v:0 -f null -
          ffprobe -v error -show_entries stream=width,height,codec_name:format=duration "$movie"
          ffmpeg -hide_banner -loglevel error -i "$movie" -map 0:v:0 -c copy -movflags +faststart "build/Skippy - Connected workspace.mp4"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.connected_walkthrough }}
        with:
          name: Skippy-connected-walkthrough
          path: build/Skippy - Connected workspace.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage-${{ matrix.batch }}
          path: |
            build/feature-review.*/build/feature-captures/
            build/feature-review.*/build/Skippy.log
          if-no-files-found: ignore
      - name: Verify and archive tested universal app
        if: ${{ inputs.connected_walkthrough || inputs.workspace_only || inputs.preferences_only || (inputs.handoffs_only && matrix.batch == 'searchhandoff') }}
        run: |
          lipo build/Skippy.app/Contents/MacOS/Skippy -verify_arch arm64 x86_64
          codesign --verify --strict build/Skippy.app
          ditto -c -k --keepParent build/Skippy.app build/Skippy-developer.zip
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.connected_walkthrough || inputs.workspace_only || inputs.preferences_only || (inputs.handoffs_only && matrix.batch == 'searchhandoff') }}
        with:
          name: Skippy-tested-universal
          path: build/Skippy-developer.zip
  package:
    if: ${{ !inputs.settings_from_run && !inputs.connected_walkthrough && !inputs.workspace_only && !inputs.preferences_only && !inputs.handoffs_only }}
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: footage-*
          path: footage
      - name: Verify and package films
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          mkdir captures
          find footage -name WindowServer.mp4 -print0 | while IFS= read -r -d '' movie; do
            ln -s "$PWD/$(dirname "$movie")" "captures/$(basename "$(dirname "$movie")")"
          done
          python3 Scripts/package-feature-films.py captures Review
      - uses: actions/upload-artifact@v4
        with:
          name: Skippy-feature-library
          path: Review
