name: Skippy checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and native tests
        run: swift test
      - name: Compile and bundle Skippy
        if: ${{ !cancelled() }}
        run: |
          bash Scripts/build-macos.sh --universal
          lipo -info build/Skippy.app/Contents/MacOS/Skippy
          lipo build/Skippy.app/Contents/MacOS/Skippy -verify_arch arm64 x86_64
      - name: Native smoke checks and launch
        if: ${{ !cancelled() }}
        run: |
          bash Scripts/check-macos.sh
          defaults write com.yourcompany.parcel hasSeenWelcome -bool YES
          defaults write com.yourcompany.parcel skippy.surface -string Floating
          defaults write com.yourcompany.parcel skippy.x -float 0.58
          defaults write com.yourcompany.parcel skippy.y -float 0.80
          defaults write com.yourcompany.parcel parcel.notch.note -string "Review the launch sketches and send the handoff."
          defaults write com.yourcompany.parcel parcel-skin -string moss
          bash Scripts/apple-terminal.sh mac
          sleep 3
          pgrep -x Skippy
          open -a "$PWD/build/Skippy.app" "$PWD/Samples/Launch notes.txt" "$PWD/Samples/A little place.png"
          sleep 2
      - name: Record the launched Mac application
        if: ${{ !cancelled() }}
        run: |
          swiftc -target "$(uname -m)-apple-macos14.0" Scripts/record-quiver.swift -o build/recorder
          build/recorder build/frames "$(pgrep -x Skippy | head -1)"
          mkdir -p build/recordings
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          ffmpeg -loglevel error -framerate 30 -i build/frames/frame-%04d.png -vf 'scale=960:-2' -pix_fmt yuv420p -movflags +faststart build/recordings/Skippy.mp4
          ffmpeg -loglevel error -framerate 30 -i build/frames/frame-%04d.png -filter_complex 'fps=15,scale=600:-1,split[a][b];[a]palettegen[p];[b][p]paletteuse' build/recordings/Skippy.gif
          cp build/frames/File-Shelf.png build/recordings/File-Shelf.png
      - name: Exercise all arrows through the running application
        if: ${{ !cancelled() }}
        run: swift Scripts/check-arrow-navigation.swift "$(pgrep -x Skippy | head -1)"
      - name: Save pointer diagnostics after a failure
        if: failure()
        run: |
          mkdir -p build/diagnostics
          last=$(ls build/frames/frame-*.png 2>/dev/null | tail -1)
          if [[ -n "$last" ]]; then cp "$last" build/diagnostics/last-frame.png; fi
      - name: Archive developer build
        if: ${{ !cancelled() }}
        run: codesign --verify --strict build/Skippy.app && ditto -c -k --keepParent build/Skippy.app build/Skippy-developer.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Skippy-Mac
          path: |
            build/Skippy-developer.zip
            build/recordings/
            build/diagnostics/
  simulators:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone and iPad
        run: |
          mkdir -p build/devices
          SKIPPY_SIM_CAPTURE=build/devices/iPhone.png bash Scripts/apple-terminal.sh iphone
          SKIPPY_SIM_CAPTURE=build/devices/iPad.png bash Scripts/apple-terminal.sh ipad
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-simulators
          path: build/devices
