name: Skippy checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac_only:
        type: boolean
        default: false
        description: Run native Mac checks without repeating simulator boots
      verified_build_run:
        type: string
        default: ""
        description: Exercise a developer build from the specified completed workspace recording run
permissions:
  contents: read
jobs:
  native-macos:
    if: ${{ !inputs.verified_build_run }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable normal system motion on the disposable test desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults read com.apple.universalaccess reduceMotion
      - name: Compiler and native tests
        run: PARCEL_PREVIEW_DIRECTORY="$RUNNER_TEMP/skippy-layout-review" swift test
      - name: Compile and bundle Skippy
        id: bundle
        run: |
          bash Scripts/build-macos.sh --universal
          lipo -info build/Skippy.app/Contents/MacOS/Skippy
          lipo build/Skippy.app/Contents/MacOS/Skippy -verify_arch arm64 x86_64
      - name: Native smoke checks and launch
        run: |
          bash Scripts/check-macos.sh
          defaults write com.yourcompany.parcel hasSeenWelcome -bool YES
          defaults write com.yourcompany.parcel skippy.surface -string Floating
          defaults write com.yourcompany.parcel skippy.x -float 0.58
          defaults write com.yourcompany.parcel skippy.y -float 0.80
          defaults write com.yourcompany.parcel parcel.notch.note -string "Review the launch sketches and send the handoff."
          defaults write com.yourcompany.parcel parcel-skin -string moss
          bash Scripts/apple-terminal.sh mac
          sleep 3
          pgrep -x Skippy
          open -a "$PWD/build/Skippy.app" "$PWD/Samples/Launch notes.txt" "$PWD/Samples/A little place.png"
          sleep 2
      - name: Record the launched Mac application
        run: |
          swiftc -parse-as-library -target "$(uname -m)-apple-macos15.0" Scripts/record-display.swift -o build/display-recorder
          swiftc -target "$(uname -m)-apple-macos14.0" Scripts/record-quiver.swift -o build/recorder
          app_pid="$(pgrep -x Skippy | head -1)"
          test -n "$app_pid"
          build/recorder build/frames "$app_pid"
          mkdir -p build/recordings
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          ffmpeg -loglevel error -i build/frames/WindowServer.mp4 -c copy -movflags +faststart build/recordings/Skippy.mp4
          ffmpeg -loglevel error -i build/recordings/Skippy.mp4 -filter_complex 'fps=15,scale=600:-1,split[a][b];[a]palettegen[p];[b][p]paletteuse' build/recordings/Skippy.gif
          cp build/frames/File-Shelf.png build/recordings/File-Shelf.png
      - name: Exercise all arrows through the running application
        run: |
          pkill -x Skippy || true
          while pgrep -x Skippy >/dev/null; do sleep 0.1; done
          bash Scripts/apple-terminal.sh mac
          sleep 2
          swift Scripts/check-arrow-navigation.swift "$(pgrep -x Skippy | head -1)"
      - name: Check real menu-bar hover and pointer handoff
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          pkill -x Skippy
          defaults write com.yourcompany.parcel skippy.surface -string "Menu bar"
          bash Scripts/apple-terminal.sh mac
          sleep 2
          swift Scripts/check-menu-hover.swift "$(pgrep -x Skippy | head -1)"
      - name: Save pointer diagnostics after a failure
        if: failure()
        run: |
          mkdir -p build/diagnostics
          if [[ -f build/frames/File-Shelf.png ]]; then cp build/frames/File-Shelf.png build/diagnostics/; fi
      - name: Archive developer build
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: codesign --verify --strict build/Skippy.app && ditto -c -k --keepParent build/Skippy.app build/Skippy-developer.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Skippy-Mac
          path: |
            build/Skippy-developer.zip
            build/recordings/
            build/diagnostics/
  simulators:
    if: ${{ !inputs.verified_build_run && !inputs.mac_only && !startsWith(github.ref_name, 'skippy/') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone and iPad
        run: |
          mkdir -p build/devices
          SKIPPY_SIM_CAPTURE=build/devices/iPhone.png bash Scripts/apple-terminal.sh iphone
          SKIPPY_SIM_CAPTURE=build/devices/iPad.png bash Scripts/apple-terminal.sh ipad
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-simulators
          path: build/devices
  existing-build-ui:
    if: ${{ inputs.verified_build_run }}
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Skippy-tested-universal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.verified_build_run }}
          path: build
      - name: Verify and exercise the archived Mac application
        run: |
          ditto -x -k build/Skippy-developer.zip build
          codesign --verify --strict build/Skippy.app
          lipo build/Skippy.app/Contents/MacOS/Skippy -verify_arch arm64 x86_64
          defaults write com.yourcompany.parcel hasSeenWelcome -bool YES
          defaults write com.yourcompany.parcel skippy.surface -string Floating
          defaults write com.apple.universalaccess reduceMotion -bool false
          bash Scripts/apple-terminal.sh mac
          sleep 3
          open -a "$PWD/build/Skippy.app" "$PWD/Samples/Launch notes.txt" "$PWD/Samples/A little place.png"
          sleep 2
          app_pid="$(pgrep -x Skippy | head -1)"
          test -n "$app_pid"
          swift Scripts/check-arrow-navigation.swift "$app_pid"
